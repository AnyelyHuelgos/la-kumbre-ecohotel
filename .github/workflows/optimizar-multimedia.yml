name: Crear version ligera de La Kumbre

on:
  push:
    branches:
      - optimizar-multimedia-20261013
    paths:
      - 'scripts/optimizar_multimedia.py'
      - '.github/workflows/optimizar-multimedia.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama de trabajo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow
        run: python -m pip install Pillow==11.1.0
      - name: Comprimir fotografias y retirar videos temporales
        run: python scripts/optimizar_multimedia.py
      - name: Validar archivos
        run: |
          test -f kumbre/static/videos/politicasLaKumbre.pdf
          test -f kumbre/templates/nosotros.html
          test ! -f kumbre/static/videos/columpio1.mp4
          test ! -f kumbre/static/videos/Como-llegar.mp4
      - name: Crear rama ligera con historial nuevo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan la-kumbre-ligera
          git add -A
          git commit -m "Optimizar fotografias y excluir videos sin alterar funcionalidad"
          git push origin HEAD:refs/heads/la-kumbre-ligera
